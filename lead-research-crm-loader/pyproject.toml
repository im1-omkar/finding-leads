[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-research-crm-loader"
version = "0.1.0"
description = "Evidence-backed lead research, human approval, and CRM import orchestration using LangGraph."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.0,<2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.1.0",
  "langchain-openai>=1.0.0,<2.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "beautifulsoup4>=4.12.0,<5.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0", "pytest-asyncio>=0.24.0,<2.0.0", "ruff>=0.6.0,<1.0.0"]

[tool.setuptools.packages.find]
include = ["lead_crm_loader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
