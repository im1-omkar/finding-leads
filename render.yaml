services:
  - type: web
    name: lead-research-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: RESEARCH_ENABLED
        value: "false"
      - key: MOCK_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_FROM
        value: "Lead Research <noreply@example.com>"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: NUMBER_OF_LEADS
        value: "20"
