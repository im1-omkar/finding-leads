services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lead_crm_loader
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_crm_loader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lead-research-backend:latest
    container_name: lead-research-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lead_crm_loader
    env_file:
      - path: ./lead-research-crm-loader/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lead-research-backend:latest
    container_name: lead-research-worker
    command: ["python", "-m", "lead_crm_loader.worker"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lead_crm_loader
    env_file:
      - path: ./lead-research-crm-loader/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: lead-research-frontend:latest
    container_name: lead-research-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
